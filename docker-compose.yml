# First draft. Ports and env vars match .env.example - update both together.
# Dockerfiles for each service do not exist yet, so `docker-compose up` will not
# work until each owner adds one under their service folder.

version: "3.9"

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-capstone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-capstone}
      POSTGRES_DB: ${DB_NAME:-capstone}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      RECOVERY_URL: http://recovery:4003
    depends_on:
      - user-service
      - order-service
      - payment-service
      - recovery
    # Needed for faultInjection's addLatency to run `tc netem` inside this
    # container. Also requires iproute2 in the image - see
    # faultInjection/src/README.md.
    cap_add:
      - NET_ADMIN

  user-service:
    build: ./services/userService
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    cap_add:
      - NET_ADMIN

  order-service:
    build: ./services/orderService
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
    cap_add:
      - NET_ADMIN

  payment-service:
    build: ./services/paymentService
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${DB_USER:-capstone}:${DB_PASSWORD:-capstone}@database:5432/${DB_NAME:-capstone}
    depends_on:
      - database
    cap_add:
      - NET_ADMIN

  monitoring:
    build: ./monitoring
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      POLL_INTERVAL_MS: 3000
      HEALTH_TIMEOUT_MS: 2000
      TARGET_SERVICES: gateway,userService,orderService,paymentService
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003

  failure-detection:
    build: ./failureDetection
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONITORING_URL: http://monitoring:4001

  recovery:
    build: ./recovery
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      FAILURE_DETECTION_URL: http://failure-detection:4002
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003

  fault-injection:
    build: ./faultInjection
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
    volumes:
      # killService stops/starts sibling containers through the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    # The Vite dev server proxies /api/* to these from inside the container.
    environment:
      MONITORING_URL: http://monitoring:4001
      FAILURE_DETECTION_URL: http://failure-detection:4002
      RECOVERY_URL: http://recovery:4003
      FAULT_INJECTION_URL: http://fault-injection:4004

volumes:
  db-data:
