# Ports and env vars match .env.example - update both together.

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-capstone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-capstone}
      POSTGRES_DB: ${DB_NAME:-capstone}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-capstone}"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      RECOVERY_URL: http://recovery:4003
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      recovery:
        condition: service_healthy
    # Needed for faultInjection's addLatency to run `tc netem` inside this
    # container. Also requires iproute2 in the image - see
    # faultInjection/src/README.md.
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  user-service:
    build: ./services/userService
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  order-service:
    build: ./services/orderService
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  payment-service:
    build: ./services/paymentService
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${DB_USER:-capstone}:${DB_PASSWORD:-capstone}@database:5432/${DB_NAME:-capstone}
    depends_on:
      database:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  monitoring:
    build: ./monitoring
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      POLL_INTERVAL_MS: 3000
      # Comfortably above failureDetection's LATENCY_THRESHOLD_MS (2000ms
      # default) so a service that's slow but still responding gets a
      # distinct highLatency alert, instead of always timing out into the
      # same "unreachable" alert a dead service would also produce.
      HEALTH_TIMEOUT_MS: 5000
      TARGET_SERVICES: gateway,userService,orderService,paymentService
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
    # Waits for the services it's about to poll, so its first snapshots are
    # real data rather than early "unreachable" reads from a service that
    # just hadn't finished booting yet.
    depends_on:
      gateway:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4001/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  failure-detection:
    build: ./failureDetection
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONITORING_URL: http://monitoring:4001
    # Waits for recovery too, not just monitoring: an alert raised before
    # recovery can accept POST /alerts is silently dropped (recovery logs
    # and moves on, by design - see alertEmitter.js), which would otherwise
    # leave that service's dashboard card stuck "unhealthy" forever with no
    # recovery session to ever resolve it.
    depends_on:
      monitoring:
        condition: service_healthy
      recovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4002/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  recovery:
    build: ./recovery
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      FAILURE_DETECTION_URL: http://failure-detection:4002
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4003/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  fault-injection:
    build: ./faultInjection
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      GATEWAY_URL: http://gateway:3000
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
    volumes:
      # killService stops/starts sibling containers through the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4004/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    # The Vite dev server proxies /api/* to these from inside the container.
    environment:
      MONITORING_URL: http://monitoring:4001
      FAILURE_DETECTION_URL: http://failure-detection:4002
      RECOVERY_URL: http://recovery:4003
      FAULT_INJECTION_URL: http://fault-injection:4004
    depends_on:
      monitoring:
        condition: service_healthy
      failure-detection:
        condition: service_healthy
      recovery:
        condition: service_healthy
      fault-injection:
        condition: service_healthy

volumes:
  db-data:
